# Cheapest way to run OmniArmor: one small Linux server (even a free-tier VM)
# running the app plus Caddy, which gets and renews free HTTPS certificates.
#
#   1. On MTRX Horizon's domain, add an A record named omniarmor pointing at the
#      server's IP address. OmniArmor runs on that subdomain (docs/OPERATIONS.md).
#   2. cp .env.example .env, then set DOMAIN, BASE_URL and SECRET_KEY in .env.
#   3. docker compose up -d
#
# Data lives in the omniarmor-data volume. See docs/COSTS.md and docs/OPERATIONS.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUSTED_PROXIES: "1"
    volumes:
      - omniarmor-data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  omniarmor-data:
  caddy-data:
  caddy-config:
