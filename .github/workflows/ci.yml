name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it replaces, so CI time
# goes on the code that is actually there now.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -c constraints.txt pyflakes pip-audit
      - name: Lint
        run: python -m pyflakes omni_armor_platform.py omni_armor_rules/rule.py omniarmor_app dashboard/build_dashboard.py wsgi.py tools
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Known security holes in dependencies
        run: pip-audit -r constraints.txt
      - name: Docker image builds
        run: docker build -t omniarmor:ci .
