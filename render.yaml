# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# The disk keeps the database and backups between deploys.
services:
  - type: web
    name: omniarmor
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: omniarmor-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false   # the subdomain on MTRX Horizyn's domain, e.g. https://omniarmor.example.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false   # e.g. OmniArmor <no-reply@omniarmor.example.com>
      - key: DAILY_JOB_HOUR_UTC
        value: "11"
      # Where Autopilot emails problems it cannot fix itself. Unset, they
      # only reach the server log, which nobody reads.
      - key: OPERATOR_EMAIL
        sync: false
      # Optional: one inbox for a short report of each server error, with no
      # personal data (one per distinct error an hour, at most 20 a day).
      # Unset, none are sent.
      - key: ERRORS_EMAIL
        sync: false
      # An address people can write to for help, named on the Help page (/help).
      - key: SUPPORT_EMAIL
        sync: false
      # The same value as MTRX Horizyn's MTRX_STATS_KEY, to show user counts
      # and daily feature use in the owner's console. Unset, /api/stats does
      # not exist.
      - key: STATS_KEY
        sync: false
      # Pro and Plus card payments (optional: without them, put a workspace
      # on a plan by hand with `flask --app wsgi plan <workspace id> pro|plus`).
      # The prices themselves live in the code (omniarmor_app/plans.py); each
      # setting is the matching per-location monthly price id from Stripe.
      # Webhook: https://<your domain>/billing/stripe/webhook
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRO_STRIPE_PRICE
        sync: false
      - key: PLUS_STRIPE_PRICE
        sync: false
      # Plus for a Kitchen Safety Bundle workspace: the difference between Plus and Pro.
      - key: PLUS_BUNDLE_UPGRADE_STRIPE_PRICE
        sync: false
      # The secret CyberLogix signs its daily reports with: the same value as
      # CyberLogix's own KITCHEN_BUNDLE_SECRET. Signed reports give the
      # workspace the Pro its Kitchen Safety Bundle includes.
      - key: KITCHEN_BUNDLE_SECRET
        sync: false
