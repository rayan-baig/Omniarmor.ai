# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# The disk keeps the database and backups between deploys.
services:
  - type: web
    name: omniarmor
    runtime: docker
    plan: starter
    # /healthz: the server answers. Give /readyz (everything behind the pages)
    # to a free uptime monitor instead (docs/OPERATIONS.md, "If the app is down").
    healthCheckPath: /healthz
    disk:
      name: omniarmor-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false   # live: https://aegizyn.mtrxhorizyn.com (a staging copy sets its own)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false   # live: Aegizyn <no-reply@aegizyn.mtrxhorizyn.com>
      - key: DAILY_JOB_HOUR_UTC
        value: "11"
      # Where Autopilot emails problems it cannot fix itself. Unset, they
      # only reach the server log, which nobody reads.
      - key: OPERATOR_EMAIL
        sync: false
      # Optional: one inbox for a short report of each server error, with no
      # personal data (one per distinct error an hour, at most 20 a day).
      # Unset, none are sent.
      - key: ERRORS_EMAIL
        sync: false
      # An address people can write to for help, named on the Help page (/help).
      # Live: help@aegizyn.mtrxhorizyn.com.
      - key: SUPPORT_EMAIL
        sync: false
      # The same value as MTRX Horizyn's MTRX_STATS_KEY, to show user counts
      # and daily feature use in the owner's console. Unset, /api/stats does
      # not exist.
      - key: STATS_KEY
        sync: false
      # Pro and Plus card payments (optional: without them, put a workspace
      # on a plan by hand with `flask --app wsgi plan <workspace id> pro|plus`).
      # The prices themselves live in the code (omniarmor_app/plans.py); each
      # setting is the matching per-location monthly or yearly price id from
      # Stripe. A yearly one left empty: that plan is offered monthly only.
      # Webhook: https://aegizyn.mtrxhorizyn.com/billing/stripe/webhook
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PRO_STRIPE_PRICE
        sync: false
      - key: PLUS_STRIPE_PRICE
        sync: false
      # Plus for a Kitchen Safety Bundle workspace: the difference between Plus and Pro.
      - key: PLUS_BUNDLE_UPGRADE_STRIPE_PRICE
        sync: false
      # Yearly prices: ten months' price for a year ("2 months free").
      - key: PRO_YEARLY_STRIPE_PRICE
        sync: false
      - key: PLUS_YEARLY_STRIPE_PRICE
        sync: false
      - key: PLUS_BUNDLE_UPGRADE_YEARLY_STRIPE_PRICE
        sync: false
      # Classroom plans for schools, yearly only: the Stripe price ids for
      # Classroom and Whole school (the prices live in plans.py). Empty: that
      # plan is sold by invoice and set by hand with
      # `flask --app wsgi plan <id> classroom|school --until <date>`.
      - key: CLASSROOM_YEARLY_STRIPE_PRICE
        sync: false
      - key: SCHOOL_YEARLY_STRIPE_PRICE
        sync: false
      # The free classroom pilot's length, in days (once per workspace).
      - key: CLASSROOM_PILOT_DAYS
        value: "30"
      # Where a school writes for an invoice. Unset: SUPPORT_EMAIL, then
      # help@mtrxhorizyn.com.
      - key: SCHOOL_INVOICE_EMAIL
        sync: false
      # The cancel screen's one-time save offer: a Stripe coupon id, and the
      # amount the screen promises (it must match the coupon). No coupon: no offer.
      - key: SAVE_OFFER_STRIPE_COUPON
        sync: false
      - key: SAVE_OFFER_PERCENT
        value: "25"
      - key: SAVE_OFFER_MONTHS
        value: "2"
      # The secret Kryozyn signs its daily reports with: the same value as
      # Kryozyn's own KITCHEN_BUNDLE_SECRET. Signed reports give the
      # workspace the Pro its Kitchen Safety Bundle includes.
      - key: KITCHEN_BUNDLE_SECRET
        sync: false
