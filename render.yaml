# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# The disk keeps the database and backups between deploys.
services:
  - type: web
    name: omniarmor
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: omniarmor-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false   # the subdomain on MTRX Horizon's domain, e.g. https://omniarmor.example.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false   # e.g. OmniArmor <no-reply@omniarmor.example.com>
      - key: DAILY_JOB_HOUR_UTC
        value: "11"
      # Where Autopilot emails problems it cannot fix itself. Unset, they
      # only reach the server log, which nobody reads.
      - key: OPERATOR_EMAIL
        sync: false
      # The same value as MTRX Horizon's MTRX_STATS_KEY, to show user counts
      # in the owner's console. Unset, /api/stats does not exist.
      - key: STATS_KEY
        sync: false
      # The Academy plan's card payments (optional: without them, switch a
      # family's plan on by hand with `flask --app wsgi academy-plan`).
      # Webhook: https://<your domain>/billing/stripe/webhook
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ACADEMY_STRIPE_PRICE
        sync: false
      - key: ACADEMY_PRICE_LABEL
        sync: false
