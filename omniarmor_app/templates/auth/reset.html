{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Choose a new password</h1>
  <form class="card mt" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>New password</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="10" aria-describedby="pw-hint">
      <span class="hint" id="pw-hint">At least 10 characters. Every other device will be signed out.</span></label>
    <button class="btn" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
