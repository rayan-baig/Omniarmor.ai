{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="narrow">
  <p class="eyebrow">Welcome back</p>
  <h1>Sign in</h1>
  <form class="card mt" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Email</span>
      <input type="email" name="email" value="{{ email }}" autocomplete="email" required></label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Sign in</button>
    <p class="hint mt-s"><a href="{{ url_for('auth.forgot') }}">Forgot your password?</a> · <a href="{{ url_for('auth.signup') }}">Create a workspace</a></p>
  </form>
</div>
{% endblock %}
