<title>OmniArmor Risk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Black with a red-orange blend. One dark theme on every device, by design: few
   surfaces, thin dividers, orange as the accent, red for anything blocked. */
:root{
  color-scheme:dark;
  --bg:#0F0E0D;
  --raise:#1A1816;
  --hover:#1D1A17;
  --ink:#E9E2D8;
  --muted:#ABA297;
  --faint:#958B80;
  --line:#2A2622;
  --field:#776D63;
  --accent:#F7743A; --accent-text:#FF9A66; --on-accent:#0F0E0D;
  --blend:linear-gradient(100deg,#E5261C 0%,#FF6A36 45%,#F59234 100%);
  --block:#F0301F; --block-text:#FF4530; --block-tint:rgba(240,48,31,.08); --on-block:#0F0E0D;
  --warn:#F08A2E;  --warn-text:#F7A85A; --warn-tint:rgba(240,138,46,.07);
  --clear-seg:#4A433C;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:12px;z-index:20;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:6px;font-weight:600;text-decoration:none}
.skip:focus{left:16px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:32px;padding-block:28px 48px;display:flex;flex-direction:column;gap:36px}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Header */
.top{display:flex;flex-direction:column;gap:18px}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.brand{display:flex;flex-direction:column;gap:6px}
.lockup{display:flex;align-items:center;gap:12px}
.lockup svg{flex:none}
.wordmark{font-family:var(--display);font-weight:800;font-size:32px;line-height:.9;letter-spacing:.03em;text-transform:uppercase}
.wordmark .dim{color:var(--faint)}
.slogan{margin:0;background:var(--blend);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:15px;font-weight:500;letter-spacing:.01em}
.totals{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:15px;color:var(--muted)}
.totals b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:6px}
.totals .t-BLOCKED b{color:var(--block-text)}
.totals .t-WARNING b{color:var(--warn-text)}
.bar{position:relative;display:flex;gap:2px;height:4px}
.seg{height:100%;min-width:0;border-radius:2px;transform-origin:left center}
.seg.BLOCKED{background:var(--block)}.seg.WARNING{background:var(--warn)}.seg.CLEARED{background:var(--clear-seg)}.seg.NONE{background:var(--line)}
.tip{position:absolute;top:calc(100% + 8px);transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);color:var(--ink);font-size:13px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}

/* Layout */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 40px)}
.search{flex:none;width:100%;height:44px;padding:0 14px;border:1px solid var(--field);border-radius:8px;background:transparent}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.ind-list{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ind{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;min-height:44px;transition:background-color .15s ease}
.ind:hover{background:var(--hover)}
.ind[aria-current="true"]{background:var(--raise)}
.ind[aria-current="true"] .code,.ind[aria-current="true"] strong{color:var(--accent-text)}
.code{font-family:var(--mono);font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.ind-name{display:flex;flex-direction:column;min-width:0}
.ind-name strong{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-note{color:var(--accent-text);font-size:12.5px}
.blk{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--block-text);font-variant-numeric:tabular-nums}
.blk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--block)}
.empty{padding:12px 10px;color:var(--muted);font-size:14px}

/* Industry */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.title-block{display:flex;flex-direction:column;gap:6px;min-width:0}
.title-block h1{margin:0;font-family:var(--display);font-weight:800;font-size:46px;line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:15px}
.sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;min-height:44px}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:38px;height:22px;border-radius:11px;background:var(--line);box-shadow:inset 0 0 0 1px var(--field);position:relative;cursor:pointer;transition:background-color .2s ease}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s ease,background-color .2s ease}
.switch input:checked{background:var(--blend);box-shadow:none}
.switch input:checked::after{transform:translateX(16px);background:var(--on-accent)}
.btn{height:44px;padding:0 18px;border-radius:8px;border:0;background:var(--blend);color:var(--on-accent);font-weight:600;cursor:pointer;font-size:15px;transition:filter .15s ease}
.btn:hover{filter:brightness(1.08)}
.link{height:44px;padding:0 4px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;text-decoration:underline;text-decoration-color:var(--field);text-underline-offset:3px}
.link:hover{color:var(--ink)}
.report-box{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.report-box textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:13px;line-height:1.5;border:1px solid var(--field);border-radius:8px;background:var(--raise);color:var(--ink);padding:12px;resize:vertical}

.rules{list-style:none;margin:0;padding:0}
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:12px 40px;padding:22px 16px;margin-inline:-16px;border-radius:10px;border-bottom:1px solid var(--line)}
.rule[data-level="BLOCKED"]{background:var(--block-tint)}
.rule[data-level="WARNING"]{background:var(--warn-tint)}
.rule-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.rule-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rule h2{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.rule.match h2 span{box-shadow:inset 0 -.38em 0 rgba(240,138,46,.35)}
.msg{margin:0;font-size:15px;text-wrap:pretty}
.msg.BLOCKED{color:var(--block-text)}.msg.WARNING{color:var(--warn-text)}.msg.NONE{color:var(--muted)}
details{font-size:14px;color:var(--muted)}
summary{cursor:pointer;width:max-content;min-height:32px;display:flex;align-items:center;gap:6px;color:var(--faint);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s ease;margin-right:2px}
details[open] summary::before{transform:rotate(45deg)}
summary:hover{color:var(--ink)}
.why{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px 14px;max-width:62ch}
.why p{margin:0;text-wrap:pretty}
.cite{font-family:var(--mono);font-size:13px}

/* Status: Blocked is filled, Warning is outlined, Cleared is plain text */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag svg{width:13px;height:13px}
.tag.BLOCKED{background:var(--block);color:var(--on-block)}
.tag.WARNING{color:var(--warn-text);box-shadow:inset 0 0 0 1px var(--warn)}
.tag.CLEARED{color:var(--muted);padding:0}
.tag.NONE{color:var(--faint);padding:0}

.rule-input{display:flex;flex-direction:column;gap:8px;min-width:0}
.q{font-size:14.5px;color:var(--muted)}
.field-row{display:flex;flex-wrap:wrap;gap:8px}
.num{display:flex;align-items:stretch;flex:1 1 140px;max-width:200px;border:1px solid var(--field);border-radius:8px;overflow:hidden}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.num input{flex:1;min-width:0;height:44px;padding:0 12px;border:0;background:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;outline:none}
.num .unit{display:flex;align-items:center;padding:0 12px;color:var(--faint);font-size:14px;white-space:nowrap}
.date{height:46px;border:1px solid var(--field);border-radius:8px;background:none;color:var(--muted);padding:0 10px;font-family:var(--mono);font-size:13px}
.date:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.limit{font-family:var(--mono);font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.yn{position:relative;display:inline-flex;border:1px solid var(--field);border-radius:8px;overflow:hidden;width:max-content}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label{min-width:84px;height:44px;display:flex;align-items:center;justify-content:center;padding:0 16px;cursor:pointer;font-size:15px;color:var(--muted);transition:background-color .15s ease,color .15s ease}
.yn label+input+label{border-left:1px solid var(--field)}
.yn input:checked+label{background:var(--blend);color:var(--on-accent);font-weight:600}
.yn input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-3px}
.no-rows{padding:32px 0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--raise);color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:14px;z-index:10;box-shadow:0 12px 32px rgba(0,0,0,.4);animation:fadeUp .3s both}
footer{color:var(--faint);font-size:13.5px;padding-top:8px;border-top:1px solid var(--line)}

/* Motion */
.wordmark .ch{display:inline-block;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 30ms)}
@keyframes rise{from{transform:translateY(.4em);opacity:.15}to{transform:none;opacity:1}}
.slogan,.totals{animation:fadeUp .7s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.mark-ring{stroke-dasharray:44;animation:draw 1.1s .2s ease-out both}
@keyframes draw{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
.bar.grow .seg{animation:grow .9s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.title-block.roll h1{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.rule.enter{animation:slideIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 40ms)}
@keyframes slideIn{from{transform:translateY(8px);opacity:.25}to{transform:none;opacity:1}}
.tag.stamp{animation:stamp .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(1.3);opacity:.4}60%{transform:scale(.96);opacity:1}100%{transform:none}}

@media (max-width: 900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:24px}
  .rail{position:static;max-height:none}
  .ind-list{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
  .ind-list li{flex:none}
  .ind{width:auto;max-width:220px}
  .rule{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 560px){
  .wrap{padding-inline:16px;padding-block:20px 36px;gap:28px}
  .rule{padding-inline:12px;margin-inline:-12px}
  .title-block h1{font-size:36px}
  .wordmark{font-size:28px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<a class="skip" href="#panel">Skip to checks</a>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <div class="lockup">
          <svg viewBox="0 0 40 46" width="28" height="32" aria-hidden="true">
            <path d="M20 2 L37 8 V22 C37 33 29.5 40.5 20 44 C10.5 40.5 3 33 3 22 V8 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"></path>
            <defs><linearGradient id="blend" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#E5261C"></stop><stop offset="1" stop-color="#F59234"></stop></linearGradient></defs>
            <circle class="mark-ring" cx="20" cy="22.5" r="7" fill="none" stroke="url(#blend)" stroke-width="3.5"></circle>
          </svg>
          <div class="wordmark" aria-label="OmniArmor.ai"><span aria-hidden="true"><span class="ch" style="--i:0">O</span><span class="ch" style="--i:1">m</span><span class="ch" style="--i:2">n</span><span class="ch" style="--i:3">i</span><span class="ch" style="--i:4">A</span><span class="ch" style="--i:5">r</span><span class="ch" style="--i:6">m</span><span class="ch" style="--i:7">o</span><span class="ch" style="--i:8">r</span></span><span class="dim" aria-hidden="true"><span class="ch" style="--i:9">.</span><span class="ch" style="--i:10">a</span><span class="ch" style="--i:11">i</span></span></div>
        </div>
        <p class="slogan">Catch the fine before it catches you.</p>
      </div>
      <div class="totals" id="totals" aria-live="polite"></div>
    </div>
    <div class="bar" id="bar" role="img"></div>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Industries">
      <label class="sr" for="q">Search industries or rules</label>
      <input class="search" id="q" type="search" placeholder="Search industries or rules" autocomplete="off">
      <ul class="ind-list" id="ind-list"></ul>
    </nav>

    <main id="panel" tabindex="-1">
      <div class="head">
        <div class="title-block">
          <span class="eyebrow" id="ind-eyebrow"></span>
          <h1 id="ind-title"></h1>
          <p class="sub" id="ind-sub" aria-live="polite"></p>
        </div>
        <div class="tools">
          <label class="switch"><input type="checkbox" id="only-problems" role="switch"> Only problems</label>
          <button class="link" type="button" id="reset">Reset</button>
          <button class="btn" type="button" id="copy">Copy report</button>
        </div>
      </div>
      <div class="report-box" id="report-box" hidden>
        <label class="eyebrow" for="report-text">Report text: select it and copy</label>
        <textarea id="report-text" readonly></textarea>
      </div>
      <ul class="rules" id="rules"></ul>
    </main>
  </div>

  <footer>Readings start as examples. Each check names its source rule. Decision support, not legal advice.</footer>
</div>

<script>
const INDUSTRIES = /*__CATALOG__*/[];

const LEVEL_LABEL = {BLOCKED: "Blocked", WARNING: "Warning", CLEARED: "Cleared", NONE: "No reading"};
const ICONS = {
  BLOCKED: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
  WARNING: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.3 11.5H1.7z"/><path d="M8 6.5v3" stroke-linecap="round"/></svg>',
  CLEARED: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>',
  NONE: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h8"/></svg>'
};

/* Mirrors omni_armor_rules.rule.evaluate so the page and the engine agree. */
function fmt(value, unit) {
  const number = value.toLocaleString("en-US", {maximumFractionDigits: 2});
  if (!unit) return number;
  if (unit.startsWith("°") || unit === "%") return number + unit;
  if (unit === "$") return "$" + number;
  return number + " " + unit;
}
function evaluate(rule, value) {
  const source = rule.policy ? " (policy setting)" : "";
  if (rule.kind === "required" || rule.kind === "forbidden") {
    if (typeof value !== "boolean") return ["NONE", "NO READING", "Answer yes or no to check this rule."];
    const broken = rule.kind === "required" ? !value : value;
    return broken
      ? ["BLOCKED", "VIOLATION", `${rule.title}: ${rule.action}`]
      : ["CLEARED", "CLEARED", `${rule.title}: in compliance${source}.`];
  }
  if (typeof value !== "number" || !Number.isFinite(value)) {
    return ["NONE", "NO READING", "Enter a reading to check this rule."];
  }
  const limit = fmt(rule.limit, rule.unit), shown = fmt(value, rule.unit);
  if (rule.kind === "max") {
    if (value > rule.limit) return ["BLOCKED", "OVER LIMIT", `${shown} is over the ${limit} limit${source}. ${rule.action}`];
    if (rule.warn !== null && value >= rule.warn) return ["WARNING", "NEAR LIMIT", `${shown} is close to the ${limit} limit${source}.`];
    return ["CLEARED", "CLEARED", `${shown} is within the ${limit} limit${source}.`];
  }
  if (value < rule.limit) return ["BLOCKED", "BELOW MINIMUM", `${shown} is below the ${limit} minimum${source}. ${rule.action}`];
  if (rule.warn !== null && value <= rule.warn) return ["WARNING", "NEAR MINIMUM", `${shown} is close to the ${limit} minimum${source}.`];
  return ["CLEARED", "CLEARED", `${shown} meets the ${limit} minimum${source}.`];
}

/* State: current reading per rule, seeded from the example values. */
const STORE_KEY = "omniarmor-console-v2";
const readings = {};
for (const ind of INDUSTRIES) {
  readings[ind.id] = {};
  for (const r of ind.rules) readings[ind.id][r.key] = r.sample;
}
let selectedId = INDUSTRIES.length ? INDUSTRIES[0].id : null;
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
  if (saved && saved.readings) {
    for (const ind of INDUSTRIES) for (const r of ind.rules) {
      const v = saved.readings[ind.id] && saved.readings[ind.id][r.key];
      const ok = (r.kind === "max" || r.kind === "min") ? (typeof v === "number" || v === null) : typeof v === "boolean";
      if (ok) readings[ind.id][r.key] = v;
    }
  }
  if (saved && INDUSTRIES.some(i => i.id === saved.selectedId)) selectedId = saved.selectedId;
} catch (e) {}
const slug = ind => ind.brand.toLowerCase();
const fromHash = INDUSTRIES.find(i => slug(i) === location.hash.slice(1).toLowerCase());
if (fromHash) selectedId = fromHash.id;

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({readings, selectedId})); } catch (e) {}
}
const levelsFor = ind => ind.rules.map(r => evaluate(r, readings[ind.id][r.key])[0]);
function tally(levels) {
  const t = {BLOCKED: 0, WARNING: 0, CLEARED: 0, NONE: 0};
  for (const l of levels) t[l]++;
  return t;
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const code = id => String(id).padStart(2, "0");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const current = () => INDUSTRIES.find(i => i.id === selectedId);
const totalRules = INDUSTRIES.reduce((n, i) => n + i.rules.length, 0);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let firstPaint = true;

/* Numbers count from what is on screen to the new value. */
function countTo(el, target) {
  const from = Number.parseInt(el.textContent, 10) || 0;
  el.dataset.value = target;
  if (from === target) return;
  if (reduceMotion) { el.textContent = target; return; }
  const start = performance.now(), dur = from === 0 ? 900 : 300;
  const step = now => {
    const t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(from + (target - from) * e);
    if (t < 1 && Number(el.dataset.value) === target) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* Header totals and bar */
function renderSummary() {
  const all = tally(INDUSTRIES.flatMap(levelsFor));
  if (!$("totals").children.length) {
    $("totals").innerHTML = ["BLOCKED", "WARNING", "CLEARED"].map(l =>
      `<span class="t-${l}"><b data-stat="${l}">0</b><span data-label="${l}"></span></span>`).join("")
      + `<span><b>${totalRules}</b>checks</span>`;
  }
  for (const l of ["BLOCKED", "WARNING", "CLEARED"]) countTo($("totals").querySelector(`[data-stat="${l}"]`), all[l]);
  $("totals").querySelector('[data-label="BLOCKED"]').textContent = "blocked";
  $("totals").querySelector('[data-label="WARNING"]').textContent = all.WARNING === 1 ? "warning" : "warnings";
  $("totals").querySelector('[data-label="CLEARED"]').textContent = "cleared";
  const order = ["BLOCKED", "WARNING", "CLEARED", "NONE"].filter(l => all[l]);
  const bar = $("bar");
  bar.setAttribute("aria-label", order.map(l => `${LEVEL_LABEL[l]} ${all[l]}`).join(", ") + ` of ${totalRules} checks`);
  bar.classList.toggle("grow", firstPaint);
  bar.innerHTML = order.map(l => `<div class="seg ${l}" style="flex-grow:${all[l]}" data-tip="${LEVEL_LABEL[l]}: ${all[l]} (${Math.round(all[l] / totalRules * 100)}%)"></div>`).join("");
}
$("bar").addEventListener("mousemove", e => {
  const seg = e.target.closest(".seg");
  let tip = $("bar").querySelector(".tip");
  if (!seg) { if (tip) tip.remove(); return; }
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; $("bar").appendChild(tip); }
  tip.textContent = seg.dataset.tip;
  const box = $("bar").getBoundingClientRect();
  tip.style.left = Math.min(Math.max(e.clientX - box.left, 70), box.width - 70) + "px";
});
$("bar").addEventListener("mouseleave", () => { const t = $("bar").querySelector(".tip"); if (t) t.remove(); });

/* Industry list, searchable by industry or by any rule */
const query = () => $("q").value.trim().toLowerCase();
const ruleMatches = (r, q) => !!q && `${r.title} ${r.citation} ${r.input}`.toLowerCase().includes(q);
function renderRail() {
  const q = query();
  const hits = i => i.rules.filter(r => ruleMatches(r, q)).length;
  const list = INDUSTRIES.filter(i => !q || `${i.brand} ${i.sector}`.toLowerCase().includes(q) || hits(i) > 0);
  $("ind-list").innerHTML = list.length ? list.map(i => {
    const t = tally(levelsFor(i));
    const label = `${i.brand}, ${i.sector}: ${plural(t.BLOCKED, "blocked check", "blocked checks")}, ${plural(t.WARNING, "warning", "warnings")}`;
    return `<li><button class="ind" type="button" data-id="${i.id}" aria-current="${i.id === selectedId}" aria-label="${esc(label)}" title="${esc(i.sector)}">
      <span class="code">${code(i.id)}</span>
      <span class="ind-name"><strong>${esc(i.brand)}</strong>${q && hits(i) ? `<span class="match-note">${plural(hits(i), "match", "matches")}</span>` : ""}</span>
      ${t.BLOCKED ? `<span class="blk" aria-hidden="true">${t.BLOCKED}</span>` : "<span></span>"}</button></li>`;
  }).join("") : `<li class="empty">No matches.</li>`;
}
$("ind-list").addEventListener("click", e => {
  const b = e.target.closest(".ind");
  if (b) select(Number(b.dataset.id));
});
$("q").addEventListener("input", () => { renderRail(); renderIndustry(false); });

/* Day counts can be entered as a date: "days since" counts up to today, "days until" counts down from it. */
function dateMode(r) {
  if (r.unit !== "days" && r.unit !== "calendar days") return null;
  if (/\bdays? since\b/i.test(r.input)) return "since";
  if (/\bdays? until\b/i.test(r.input)) return "until";
  return null;
}
const MS_DAY = 86400000;
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysFromDate(value, mode) {
  const [y, m, d] = value.split("-").map(Number);
  if (!y || !m || !d) return null;
  const picked = new Date(y, m - 1, d);
  return Math.round((mode === "since" ? todayStart() - picked : picked - todayStart()) / MS_DAY);
}
function limitText(r) {
  if (r.kind === "max") return `Limit ${fmt(r.limit, r.unit)}` + (r.warn !== null ? ` · warns from ${fmt(r.warn, r.unit)}` : "");
  if (r.kind === "min") return `Minimum ${fmt(r.limit, r.unit)}` + (r.warn !== null ? ` · warns at ${fmt(r.warn, r.unit)} or less` : "");
  return "";
}
function inputHtml(ind, r) {
  const id = `in-${ind.id}-${r.key}`;
  const v = readings[ind.id][r.key];
  if (r.kind === "max" || r.kind === "min") {
    const mode = dateMode(r);
    return `<label class="q" for="${id}">${esc(r.input)}</label>
      <div class="field-row">
        <div class="num"><input id="${id}" type="number" inputmode="decimal" step="any" value="${v === null ? "" : v}" data-key="${r.key}">${r.unit ? `<span class="unit">${esc(r.unit)}</span>` : ""}</div>
        ${mode ? `<input class="date" type="date" id="${id}-date" data-date-for="${r.key}" data-mode="${mode}" aria-label="Or pick the ${mode === "since" ? "date it happened" : "due date"}" title="Pick a date instead">` : ""}
      </div>
      <span class="limit">${esc(limitText(r))}</span>`;
  }
  return `<span class="q" id="${id}-q">${esc(r.input)}</span>
    <div class="yn" role="radiogroup" aria-labelledby="${id}-q">
      <input type="radio" name="${id}" id="${id}-y" value="yes" data-key="${r.key}" ${v === true ? "checked" : ""}><label for="${id}-y">Yes</label>
      <input type="radio" name="${id}" id="${id}-n" value="no" data-key="${r.key}" ${v === false ? "checked" : ""}><label for="${id}-n">No</label>
    </div>`;
}
const tagHtml = level => `<span class="tag ${level}">${ICONS[level]}${LEVEL_LABEL[level]}</span>`;
/* Cleared results stay readable to screen readers but are not shown, to keep the list quiet. */
const msgClass = level => `msg ${level}${level === "CLEARED" ? " sr" : ""}`;
function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function renderIndustry(animate = true) {
  const ind = current();
  if (!ind) return;
  if (animate) replay(document.querySelector(".title-block"), "roll");
  $("ind-eyebrow").textContent = `${code(ind.id)} / ${INDUSTRIES.length} · ${ind.sector}`;
  $("ind-title").textContent = ind.brand;
  const rank = {BLOCKED: 0, WARNING: 1, NONE: 2, CLEARED: 3};
  const q = query();
  const rows = ind.rules.map((r, n) => ({r, n, res: evaluate(r, readings[ind.id][r.key])}))
    .filter(({res}) => !$("only-problems").checked || res[0] === "BLOCKED" || res[0] === "WARNING")
    .sort((a, b) => rank[a.res[0]] - rank[b.res[0]] || a.n - b.n);
  $("rules").innerHTML = rows.length ? rows.map(({r, res}, idx) => `
    <li class="rule${animate ? " enter" : ""}${ruleMatches(r, q) ? " match" : ""}" style="--i:${idx}" data-level="${res[0]}" data-key="${r.key}">
      <div class="rule-main">
        <div class="rule-top"><h2><span>${esc(r.title)}</span></h2><span class="status">${tagHtml(res[0])}</span></div>
        <p class="${msgClass(res[0])}" aria-live="polite">${esc(res[2])}</p>
        <details>
          <summary>Why it matters</summary>
          <div class="why">
            <p>${esc(r.cost)}</p>
            <p class="cite">${esc(r.citation)}${r.policy ? " · policy setting, adjust to yours" : ""}</p>
          </div>
        </details>
      </div>
      <div class="rule-input">${inputHtml(ind, r)}</div>
    </li>`).join("") : `<li class="no-rows">No problems in ${esc(ind.brand)} with the current readings.</li>`;
  renderIndustrySummary(ind);
}
function renderIndustrySummary(ind) {
  const t = tally(levelsFor(ind));
  $("ind-sub").innerHTML = `<b>${t.BLOCKED}</b> blocked · <b>${t.WARNING}</b> ${t.WARNING === 1 ? "warning" : "warnings"} · <b>${t.CLEARED}</b> cleared`
    + (t.NONE ? ` · <b>${t.NONE}</b> without a reading` : "");
}
/* Update one row in place so typing keeps focus. */
function updateRow(ind, key) {
  const r = ind.rules.find(x => x.key === key);
  const row = $("rules").querySelector(`.rule[data-key="${key}"]`);
  const res = evaluate(r, readings[ind.id][key]);
  if (row) {
    const changed = row.dataset.level !== res[0];
    row.dataset.level = res[0];
    row.classList.remove("enter");
    if (changed) {
      row.querySelector(".status").innerHTML = tagHtml(res[0]);
      if (!reduceMotion) row.querySelector(".tag").classList.add("stamp");
    }
    const msg = row.querySelector(".msg");
    msg.className = msgClass(res[0]);
    msg.textContent = res[2];
  }
  renderIndustrySummary(ind);
  renderSummary();
  renderRail();
}
$("rules").addEventListener("input", e => {
  const el = e.target;
  const ind = current();
  if (el.dataset.dateFor) {
    const days = daysFromDate(el.value, el.dataset.mode);
    if (days === null) return;
    const key = el.dataset.dateFor;
    readings[ind.id][key] = days;
    const num = $(`in-${ind.id}-${key}`);
    if (num) num.value = days;
    updateRow(ind, key);
    save();
    return;
  }
  if (!el.dataset.key) return;
  if (el.type === "number") {
    const n = el.value.trim() === "" ? null : Number(el.value);
    readings[ind.id][el.dataset.key] = Number.isFinite(n) ? n : null;
  } else {
    readings[ind.id][el.dataset.key] = el.value === "yes";
  }
  updateRow(ind, el.dataset.key);
  save();
});
$("only-problems").addEventListener("change", () => renderIndustry());
$("reset").addEventListener("click", () => {
  const ind = current();
  for (const r of ind.rules) readings[ind.id][r.key] = r.sample;
  save();
  renderAll();
  toast(`${ind.brand} readings reset to examples`);
});

/* Plain-text report for the selected industry */
function reportText(ind) {
  const t = tally(levelsFor(ind));
  const date = new Date().toLocaleDateString("en-US", {year: "numeric", month: "long", day: "numeric"});
  const lines = [`OmniArmor.ai compliance report`, `${ind.brand} (${ind.sector}), ${date}`,
    `${t.BLOCKED} blocked, ${plural(t.WARNING, "warning", "warnings")}, ${t.CLEARED} cleared` + (t.NONE ? `, ${t.NONE} without a reading` : ""), ""];
  for (const level of ["BLOCKED", "WARNING", "NONE", "CLEARED"]) {
    const rules = ind.rules.filter(r => evaluate(r, readings[ind.id][r.key])[0] === level);
    if (!rules.length) continue;
    lines.push(LEVEL_LABEL[level].toUpperCase());
    for (const r of rules) {
      const res = evaluate(r, readings[ind.id][r.key]);
      lines.push(level === "CLEARED" ? `- ${r.title}` : `- ${r.title}: ${res[2]} [${r.citation}]`);
    }
    lines.push("");
  }
  lines.push("Readings entered by hand. Decision support, not legal advice.");
  return lines.join("\n");
}
function toast(text) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}
$("copy").addEventListener("click", () => {
  const ind = current();
  const text = reportText(ind);
  const fallback = () => {
    $("report-box").hidden = false;
    $("report-text").value = text;
    $("report-text").focus();
    $("report-text").select();
    toast("Select the report text and copy it");
  };
  try {
    navigator.clipboard.writeText(text).then(() => { $("report-box").hidden = true; toast(`Report for ${ind.brand} copied`); }, fallback);
  } catch (e) { fallback(); }
});

function select(id) {
  selectedId = id;
  $("report-box").hidden = true;
  try { history.replaceState(null, "", "#" + slug(current())); } catch (e) {}
  save();
  renderRail();
  renderIndustry();
  if (window.matchMedia("(max-width: 900px)").matches) $("panel").scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "start"});
}
function renderAll() {
  renderSummary();
  renderRail();
  renderIndustry();
  firstPaint = false;
}
renderAll();
</script>
